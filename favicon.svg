<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Dark Aerospace Squircle Background -->
    <linearGradient id="kf_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070e22"/>
      <stop offset="50%" stop-color="#030714"/>
      <stop offset="100%" stop-color="#02040a"/>
    </linearGradient>

    <!-- Outer Rim Accent Gradient -->
    <linearGradient id="kf_rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#818cf8" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#10b981" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Stem / Core Data Pillar (Sky to Royal Deep Blue) -->
    <linearGradient id="kf_stem" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Upper Wing / AI Cloud & Growth (Cyan to Neon Emerald) -->
    <linearGradient id="kf_up" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="45%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Lower Wing / Edge IoT & Deep Infrastructure (Cobalt to Electric Indigo) -->
    <linearGradient id="kf_down" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Ambient Core Bloom -->
    <radialGradient id="kf_core_glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft Filter Glow -->
    <filter id="kf_glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes kf_pulse {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.9; transform: scale(1.3); }
      }
      .kf_beacon {
        transform-origin: 48.5px 13.5px;
        animation: kf_pulse 2.8s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="16" fill="url(#kf_bg)" stroke="url(#kf_rim)" stroke-width="1.5"/>

  <!-- Ambient Light Center -->
  <circle cx="33" cy="32" r="22" fill="url(#kf_core_glow)"/>

  <!-- Stem: Vertical Infrastructure Pillar -->
  <line x1="18.5" y1="17.5" x2="18.5" y2="46.5" stroke="url(#kf_stem)" stroke-width="8" stroke-linecap="round"/>
  <!-- Stem Specular Highlight -->
  <line x1="18" y1="18" x2="18" y2="30" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.45"/>

  <!-- Upper Arm: AI Intelligence & Aerial Ascent -->
  <line x1="26.5" y1="29.5" x2="43.5" y2="16.5" stroke="url(#kf_up)" stroke-width="8" stroke-linecap="round"/>
  <!-- Upper Arm Specular Highlight -->
  <line x1="28.5" y1="27.5" x2="41" y2="18" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" opacity="0.35"/>

  <!-- Lower Arm: Edge Robotics & Physical Automation -->
  <line x1="26.5" y1="34.5" x2="43.5" y2="47.5" stroke="url(#kf_down)" stroke-width="8" stroke-linecap="round"/>
  <!-- Lower Arm Specular Highlight -->
  <line x1="28.5" y1="36.5" x2="41" y2="46" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" opacity="0.25"/>

  <!-- Convergence Micro-Singularity Core -->
  <circle cx="27" cy="32" r="2.4" fill="#38bdf8" filter="url(#kf_glow)"/>
  <circle cx="27" cy="32" r="1.1" fill="#ffffff"/>

  <!-- Satellite IoT Sensor Pulse Beacon -->
  <circle class="kf_beacon" cx="48.5" cy="13.5" r="5.5" fill="#10b981" opacity="0.4" filter="url(#kf_glow)"/>
  <circle cx="48.5" cy="13.5" r="3.2" fill="#34d399"/>
  <circle cx="48.5" cy="13.5" r="1.2" fill="#ffffff"/>
</svg>
